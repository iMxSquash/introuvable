<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fichier introuvable — un mini-jeu 3D caché</title>
    <meta
      name="description"
      content="Un fichier a disparu dans la Corbeille de ce Mac virtuel. Explorez le bureau, récupérez les fragments et restaurez-le avant qu'il ne soit trop tard."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <svg id="liquid-glass-defs" width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false"></svg>
    <canvas id="game-canvas"></canvas>
    <div class="hud">
      <div id="finder-path" class="hud__finder-path liquid-glass"></div>
      <div id="fragment-counter" class="hud__fragment-counter liquid-glass"></div>
    </div>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <div id="touch-joystick" class="touch-joystick liquid-glass" aria-hidden="true">
      <div id="touch-joystick-thumb" class="touch-joystick__thumb"></div>
    </div>
    <button id="touch-jump-button" class="touch-jump-button liquid-glass" type="button" aria-hidden="true" aria-label="Sauter">
      Saut
    </button>
    <div id="rotate-device-overlay" class="rotate-device-overlay" role="status" aria-live="polite">
      <div class="rotate-device-overlay__panel">
        <div class="rotate-device-overlay__icon" aria-hidden="true"></div>
        <p class="rotate-device-overlay__message">Tournez votre appareil en mode paysage pour jouer</p>
      </div>
    </div>
    <div id="start-screen" class="start-screen">
      <div class="start-screen__panel liquid-glass liquid-glass--lg">
        <svg class="start-screen__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="7" stroke="#0a84ff" stroke-width="2.4" />
          <line x1="15.15" y1="15.15" x2="21" y2="21" stroke="#0a84ff" stroke-width="2.4" stroke-linecap="round" />
        </svg>
        <p class="start-screen__title">Le fichier que vous cherchiez a été déplacé dans la Corbeille.</p>
        <button type="button" id="start-screen-cta" class="start-screen__cta">Rechercher le fichier</button>
        <p id="start-screen-restored-count" class="start-screen__restored-count"></p>
      </div>
    </div>
    <div id="finder-window-overlay" class="finder-window-overlay" hidden>
      <div class="finder-window liquid-glass liquid-glass--lg" role="dialog" aria-modal="true" aria-labelledby="finder-window-title">
        <div class="finder-window__titlebar">
          <span class="finder-window__dot finder-window__dot--red"></span>
          <span class="finder-window__dot finder-window__dot--yellow"></span>
          <span class="finder-window__dot finder-window__dot--green"></span>
          <span id="finder-window-title" class="finder-window__title">Bureau</span>
        </div>
        <div class="finder-window__body">
          <div class="finder-window__file">
            <div class="finder-window__file-icon">
              <span class="finder-window__file-fold"></span>
            </div>
            <span id="finder-window-filename" class="finder-window__file-name"></span>
          </div>
        </div>
        <div class="finder-window__footer">
          <button id="finder-window-open" type="button" class="finder-window__open-button">Ouvrir</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
